[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sugimoto", email = "takutotakuto1121@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
call-me-maybe = "call_me_maybe:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]

[tool.uv]
package = false
